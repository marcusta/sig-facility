<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Overlay Test</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #0a0a0a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }
  .container {
    text-align: center;
    padding: 2rem;
  }
  h1 {
    font-size: 2.5rem;
    font-weight: 300;
    color: #4fc3f7;
    margin-bottom: 0.5rem;
  }
  .status {
    font-size: 1rem;
    color: #81c784;
    margin-bottom: 2rem;
  }
  .info {
    font-size: 0.85rem;
    color: #888;
    line-height: 1.6;
  }
  .badge {
    display: inline-block;
    background: #1a237e;
    color: #90caf9;
    padding: 0.25rem 0.75rem;
    border-radius: 4px;
    font-size: 0.8rem;
    margin-top: 1rem;
  }
  #bridge-status {
    margin-top: 1.5rem;
    font-size: 0.85rem;
    color: #666;
  }
</style>
</head>
<body>
  <div class="container">
    <h1>Overlay OK</h1>
    <div class="status">WebView2 is working</div>
    <div class="info">
      Sweden Indoor Golf — Overlay System<br>
      Press <kbd>Ctrl+Shift+R</kbd> to reload<br>
      Press <kbd>Escape</kbd> to exit
    </div>
    <div class="badge">Phase 0+1 Test Page</div>
    <div id="bridge-status">JS→AHK bridge: testing...</div>
  </div>
  <script>
    // Test JS→AHK bridge if available
    try {
      if (window.chrome && window.chrome.webview) {
        document.getElementById('bridge-status').textContent = 'JS→AHK bridge: available';
        document.getElementById('bridge-status').style.color = '#81c784';
      } else {
        document.getElementById('bridge-status').textContent = 'JS→AHK bridge: not available (normal in dev)';
        document.getElementById('bridge-status').style.color = '#ffa726';
      }
    } catch (e) {
      document.getElementById('bridge-status').textContent = 'JS→AHK bridge: error — ' + e.message;
      document.getElementById('bridge-status').style.color = '#ef5350';
    }
  </script>
</body>
</html>
