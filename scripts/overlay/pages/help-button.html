<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #1a2332;
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100vh;
    overflow: hidden;
  }

  .help-btn {
    width: 40px;
    height: 40px;
    border-radius: 14px;
    border: none;
    background: #1a2332;
    color: #eab308;
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 1.875rem;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }

  .help-btn:hover {
    background: transparent;
    border-color: transparent;
    transform: scale(1.05);
  }

  .help-btn.alert {
    animation: pulse 1.5s ease-in-out infinite;
    border-color: #ef4444;
    color: #ef4444;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
    50% { box-shadow: 0 0 12px 4px rgba(239, 68, 68, 0.3); }
  }
</style>
</head>
<body>
  <button class="help-btn" id="help-btn">?</button>
<script>
  document.getElementById("help-btn").addEventListener("click", function() {
    if (window.chrome && window.chrome.webview) {
      window.chrome.webview.postMessage("help-click");
    }
  });

  window.setAlert = function(active) {
    var btn = document.getElementById("help-btn");
    if (active) {
      btn.classList.add("alert");
    } else {
      btn.classList.remove("alert");
    }
  };
</script>
</body>
</html>
